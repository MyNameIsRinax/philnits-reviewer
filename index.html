<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Passport Exam Reviewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <div class="kicker">ITPEC &middot; IT PASSPORT EXAMINATION</div>
    <h1>Exam Reviewer</h1>
    <p>Practice past questions, shuffle the choices, and see why every answer is right or wrong.</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Exams"></nav>

  <div class="toolbar">
    <label class="switch"><input type="checkbox" id="shuffleToggle" checked> <span>Shuffle answer choices</span></label>
    <button class="link-btn" id="resetAll" type="button">Clear all progress</button>
  </div>

  <div class="statline">
    <span id="statLeft"></span>
    <span id="statRight"></span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <main class="card" id="card"></main>

  <footer class="site">Pick an answer to check yourself. Explanations appear for every choice after you answer.</footer>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
