# Checks the ITPEC past-exam page every day, adds any new IT Passport exam to the reviewer, and fills in
# missing explanations with Google's free Gemini API (if the GEMINI_API_KEY secret is set).
name: Import new ITPEC exams

on:
  schedule:
    - cron: "0 1 * * *"  # every day at 01:00 UTC (09:00 Philippine time)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: import-exams
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -r tools/requirements.txt

      - name: Import exams and write explanations
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python tools/import_exams.py

      # GitHub turns off scheduled workflows in public repositories after 60 days without activity,
      # and new exams only come twice a year, so record a check-in commit once a month.
      - name: Keep the daily schedule alive
        id: keepalive
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$days" -ge 30 ]; then
            date -u +"Last checked for new exams: %Y-%m-%d" > tools/last-check.txt
            echo "touch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and deploy
        if: steps.run.outputs.changed == 'true' || steps.keepalive.outputs.touch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: "${{ steps.run.outputs.message || 'Check in: no new ITPEC exams' }}"
          CHANGED: ${{ steps.run.outputs.changed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js index.html img tools/last-check.txt
          git commit -m "$MESSAGE"
          git push
          # pushes made by this workflow do not trigger other workflows, so start the Pages deploy directly
          if [ "$CHANGED" = "true" ]; then gh workflow run static.yml --ref main; fi

      - name: Report failed imports
        if: steps.run.outputs.failed != ''
        env:
          FAILED: ${{ steps.run.outputs.failed }}
        run: |
          echo "::error::Could not import: $FAILED (see the run summary)"
          exit 1
