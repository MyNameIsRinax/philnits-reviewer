<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practice 900 past ITPEC IT Passport (IP) exam questions with an explanation for every answer choice.">
<title>IT Passport Reviewer</title>
<link rel="stylesheet" href="style.css?v=3.4">
<script>
  // Apply a saved light/dark choice before the page paints.
  try {
    var saved = JSON.parse(localStorage.getItem('ipq_v3') || '{}');
    var th = saved.settings && saved.settings.theme;
    if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  } catch (e) { /* storage unavailable */ }
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/" aria-label="IT Passport Reviewer home">
      <span class="logo"><img src="img/philnits-logo.png" width="200" height="91" alt="PhilNITS"></span>
      <span class="brand-text"><b>IT Passport Reviewer</b><small>ITPEC past exams 2022–2026</small></span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode"></button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings"></button>
    </div>
  </div>
</header>

<main id="app" class="wrap"></main>

<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>

<noscript><p class="wrap">This reviewer needs JavaScript turned on.</p></noscript>
<script src="data.js?v=3.4"></script>
<script src="app.js?v=3.4"></script>
</body>
</html>
